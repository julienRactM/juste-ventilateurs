services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      POSTGRES_USER: tsuser
      POSTGRES_PASSWORD: tspassword
      POSTGRES_DB: tsdb
       - TZ=Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - ./timescaledb/data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.12.0
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" 
    depends_on:
      - timescaledb
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - timescaledb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Paris
    volumes:
      - grafana_data:/var/lib/grafana

  api-node:
    container_name: api-node
    build:
      context: ./nodejs-server
      dockerfile: Dockerfile
    depends_on:
      - timescaledb
    command: ["node", "dist/server.js"]
    environment:
      - DATABASE_URL=postgresql://tsuser:tspassword@timescaledb:5432/tsdb
      - PORT=3333
      - DEBUG=prisma:config,prisma:client:setup
      - MQTT_URL=mqtt://mosquitto:1883
      - TZ=Europe/Paris
    ports:
      - "3333:3333"

  mqtt-producer:
    container_name: mqtt-producer
    build: ./nodejs-server
    command: ["node", "dist/mqtt/producer.js"]
    depends_on:
      - mosquitto
      - api-node
    environment:
      - DATABASE_URL=postgresql://tsuser:tspassword@timescaledb:5432/tsdb
      - MQTT_URL=mqtt://mosquitto:1883
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}

  mqtt-consumer:
    container_name: mqtt-consumer
    build: ./nodejs-server
    command: ["node", "dist/mqtt/stateless-consumer.js"]
    # command: ["node", "dist/src/mqtt/statefull-consumer.js"]
    depends_on:
      - mosquitto
      - timescaledb
      - api-node
    environment:
      - DATABASE_URL=postgresql://tsuser:tspassword@timescaledb:5432/tsdb
      - MQTT_URL=mqtt://mosquitto:1883

volumes:
  grafana_data:
  pgadmin_data:
  timescaledb: